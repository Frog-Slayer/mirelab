server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA — React Router가 다루는 경로는 전부 index.html로 폴백
    location / {
        try_files $uri $uri/ /index.html;
    }

    # REST API — 컨트롤러가 전부 /api 프리픽스를 쓴다. 인증 없는 내부 전용
    # /internal/* 은 여기서 아예 프록시하지 않는다(경로 자체가 없음 = 자연히 차단).
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 함께 쓰는 기록의 실시간 편집(Yjs) — WebSocket 업그레이드
    location /yjs/ {
        # handshake URI에는 이미 일회용인 티켓만 있지만, 방어적으로 쿼리 자체를 기록하지 않는다.
        access_log off;
        proxy_pass http://realtime:1234/yjs/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}
