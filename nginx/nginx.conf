server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA — React Router가 다루는 경로는 전부 index.html로 폴백
    location / {
        try_files $uri $uri/ /index.html;
    }

    # REST API — 컨트롤러가 전부 /api 프리픽스를 쓴다. 인증 없는 내부 전용
    # /internal/* 은 여기서 아예 프록시하지 않는다(경로 자체가 없음 = 자연히 차단).
    location /api/ {
        # 프로필 사진 업로드가 지나간다. nginx 기본값 1MB 를 그대로 두면 백엔드가 받도록
        # 설정한 크기(spring.servlet.multipart.max-request-size=4MB)에 닿기도 전에 여기서
        # 413 이 난다 — 백엔드 한도와 같은 값으로 맞춰 잘리는 지점을 한 곳으로 모은다.
        client_max_body_size 4m;

        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 함께 쓰는 기록의 실시간 편집(Yjs) — WebSocket 업그레이드
    location /yjs/ {
        proxy_pass http://realtime:1234/yjs/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}
