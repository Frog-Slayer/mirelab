name: mirelab

services:
  db:
    build:
      context: ./postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mirelab}
      POSTGRES_USER: ${POSTGRES_USER:-mirelab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD를 .env에 설정하세요}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mirelab} -d ${POSTGRES_DB:-mirelab}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./mirelab-backend
      target: prod
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-mirelab}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-mirelab}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?}
      ALADIN_TTB_KEY: ${ALADIN_TTB_KEY:?ALADIN_TTB_KEY를 .env에 설정하세요}

      # 브라우저가 접근하는 공개 주소. 구글에 등록한 리디렉션 URI 와 여기서 만들어지는 값이
      # 글자 그대로 같아야 해서, 틀린 값으로 조용히 뜨지 않게 기본값을 두지 않는다.
      MIRELAB_FRONTEND_URL: ${MIRELAB_PUBLIC_BASE_URL:?MIRELAB_PUBLIC_BASE_URL을 .env에 설정하세요}
      MIRELAB_PUBLIC_BASE_URL: ${MIRELAB_PUBLIC_BASE_URL:?MIRELAB_PUBLIC_BASE_URL을 .env에 설정하세요}
      # https 로 서비스하면 반드시 true — 아니면 refresh 쿠키가 평문으로 오간다
      MIRELAB_COOKIE_SECURE: ${MIRELAB_COOKIE_SECURE:-true}
      MIRELAB_ADMIN_EMAIL: ${MIRELAB_ADMIN_EMAIL:?MIRELAB_ADMIN_EMAIL을 .env에 설정하세요}

      MIRELAB_JWT_SECRET: ${MIRELAB_JWT_SECRET:?MIRELAB_JWT_SECRET을 .env에 설정하세요}
      MIRELAB_INTERNAL_SECRET: ${MIRELAB_INTERNAL_SECRET:?MIRELAB_INTERNAL_SECRET을 .env에 설정하세요}

      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID를 .env에 설정하세요}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?GOOGLE_CLIENT_SECRET을 .env에 설정하세요}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  realtime:
    build:
      context: ./mirelab-realtime
      target: prod
    environment:
      SPRING_BASE_URL: http://backend:8080
      # backend 와 같은 값이어야 한다 — 다르면 스냅샷 저장·접속 인가가 전부 403 이 된다
      INTERNAL_SECRET: ${MIRELAB_INTERNAL_SECRET:?MIRELAB_INTERNAL_SECRET을 .env에 설정하세요}
    depends_on:
      - backend
    restart: unless-stopped

  # 정적 파일(dist/)만 만들고 공유 볼륨에 내려놓은 뒤 종료하는 1회성 컨테이너 —
  # nginx와 완전히 분리된 서비스로 두기 위해, 이미지를 합치는 대신 볼륨으로 넘겨준다.
  frontend-build:
    build:
      context: ./mirelab-frontend
      target: builder
    command: ["sh", "-c", "cp -r /app/dist/. /shared/"]
    volumes:
      - frontend_dist:/shared

  nginx:
    build:
      context: ./nginx
    volumes:
      - frontend_dist:/usr/share/nginx/html:ro
    ports:
      - "80:80"
    depends_on:
      frontend-build:
        condition: service_completed_successfully
      backend:
        condition: service_started
      realtime:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
  frontend_dist:
