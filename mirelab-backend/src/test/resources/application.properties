# 테스트 전용 — Docker/Postgres 없이도 돌아가도록 가벼운 임베디드 H2를 쓴다.
# 운영/개발 런타임(src/main/resources/application.properties)은 Postgres만 쓴다.
spring.datasource.url=jdbc:h2:mem:mirelab-test;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
