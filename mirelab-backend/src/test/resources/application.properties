# 테스트 전용 설정.
#
# ⚠️ 이 파일은 src/main/resources/application.properties 를 **가린다** — classpath 에서
# application.properties 는 이름당 하나만 잡히고, 테스트 클래스 경로가 앞에 온다.
# 즉 여기 없는 설정은 테스트에서 아예 존재하지 않는다. 메인 쪽에 프로퍼티를 새로 추가하면
# (특히 @Value 로 기본값 없이 읽는 것) 여기에도 같이 넣어야 컨텍스트가 뜬다.

# --- Datasource: Docker/Postgres 없이도 돌아가도록 임베디드 H2 ---
spring.datasource.url=jdbc:h2:mem:mirelab-test;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update

# --- Aladin ---
aladin.ttb-key=test-ttb-key

# --- 인증: 실제 비밀값 없이 컨텍스트만 뜨면 되니 형식만 맞는 더미를 넣는다 ---
# (jwt secret 은 HS256 최소 길이인 32바이트를 넘겨야 JwtService 가 생성된다)
mirelab.frontend-url=http://localhost:5173
mirelab.public-base-url=http://localhost:5173
mirelab.admin-email=admin@example.invalid
mirelab.admin-name=관리자
mirelab.jwt.secret=test-only-secret-at-least-32-bytes-long!!
mirelab.jwt.access-token-ttl=PT30M
mirelab.refresh-token-ttl=P30D
mirelab.realtime-ticket-ttl=PT20S
mirelab.signup-token-ttl=PT30M
mirelab.cookie.secure=false
mirelab.internal-secret=test-only-internal-secret

# --- 구글 OAuth2 ---
spring.security.oauth2.client.registration.google.client-id=test-client-id
spring.security.oauth2.client.registration.google.client-secret=test-client-secret
spring.security.oauth2.client.registration.google.scope=openid,email,profile
spring.security.oauth2.client.registration.google.redirect-uri=${mirelab.public-base-url}/api/login/oauth2/code/google
