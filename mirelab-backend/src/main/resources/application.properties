spring.application.name=mirelab-backend

# 구글 client-id/secret, jwt secret 등 비밀값은 여기 두지 않는다 — 아래 파일에 넣고 gitignore 한다.
# 없어도 부팅은 되게 optional 로 둔다(테스트·CI는 환경변수나 test 프로퍼티로 채운다).
spring.config.import=optional:file:./application-secret.properties

# dev 프로필은 여기서 기본값으로 켜두지 않는다 — 운영 배포가 SPRING_PROFILES_ACTIVE 를
# 깜빡 안 정해도 DevDataSeeder(@Profile("dev"))가 조용히 돌아버리면 안 되기 때문이다.
# 로컬 실행은 build.gradle.kts 의 bootRun 태스크가 명시적으로 dev 를 켠다.

# --- Datasource (Postgres — dev/prod 공통, 값은 컨테이너 환경변수로 주입) ---
# 일부러 기본값을 안 둔다 — Postgres 연결정보 없이 조용히 딴 데 붙어버리는 상황을 막기 위함.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# 커넥션을 10초 넘게 쥐고 있으면 그 자리의 스택을 로그로 남긴다. 풀이 말라 죽을 때는
# "타임아웃 30초" 예외만 잔뜩 나와서 정작 누가 붙들고 있는지가 안 보인다.
spring.datasource.hikari.leak-detection-threshold=10000

# --- JPA ---
# open-in-view 를 끈다. 켜두면 EntityManager 가 요청이 끝날 때까지 살아 있는데, SSE 응답은
# 스트림을 닫기 전까지 "끝나지 않는 요청"이라 그동안 커넥션 하나를 붙들고 있는다
# (SlotController.slotEvents). 보는 사람이 풀 크기(기본 10)만큼 모이면 그 뒤 요청은 전부
# HikariPool 대기 30초 뒤 타임아웃으로 죽는다 — 실제로 그렇게 한 번 터졌다.
# 대신 DB 를 건드리는 일은 전부 @Transactional 안에서 끝내야 한다. 트랜잭션 밖으로 나간
# 엔티티는 detached 라 lazy 연관을 읽는 순간 LazyInitializationException 이 난다.
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

# --- Aladin (도서 검색, https://blog.aladin.co.kr/openapi) ---
aladin.ttb-key=${ALADIN_TTB_KEY:}

# --- 인증 ---
# frontend-url: 구글에서 돌아온 뒤 브라우저를 돌려보낼 곳.
# public-base-url: 브라우저가 이 백엔드에 닿는 주소. dev 에선 vite 프록시를 거치므로 프론트와 같다.
#   vite 프록시가 changeOrigin 으로 Host 를 바꿔서 Spring 이 자기를 localhost:8080 으로 인식한다 —
#   그래서 redirect-uri 를 {baseUrl} 로 두면 구글에 등록한 주소와 어긋난다. 절대 URL 로 고정한다.
mirelab.frontend-url=${MIRELAB_FRONTEND_URL:http://localhost:5173}
mirelab.public-base-url=${MIRELAB_PUBLIC_BASE_URL:http://localhost:5173}

# dev 시드가 admin 으로 만들 계정. 이 구글 계정으로 로그인한 사람이 가입 신청을 승인한다.
mirelab.admin-email=${MIRELAB_ADMIN_EMAIL:pj0642@gmail.com}
# 부팅할 때 이 이메일의 admin 이 없으면 만들어 준다(AdminBootstrap). 이름이 같고 로그인
# 계정이 안 붙은 사람이 이미 있으면 새로 만들지 않고 그 행에 붙인다.
mirelab.admin-name=${MIRELAB_ADMIN_NAME:영서}

mirelab.jwt.secret=${MIRELAB_JWT_SECRET:}
mirelab.jwt.access-token-ttl=PT30M
mirelab.refresh-token-ttl=P30D
# WebSocket handshake 한 번에만 쓰는 블록 전용 티켓. URL에 실려도 노출 시간을 최소화한다.
mirelab.realtime-ticket-ttl=PT20S
# 관리자 승인 후 구글 인증을 마친 사용자가 가입 정보를 입력할 수 있는 시간
mirelab.signup-token-ttl=PT30M

# https 로 서비스하면 반드시 true 로 (dev 는 http://localhost 라 false)
mirelab.cookie.secure=${MIRELAB_COOKIE_SECURE:false}

# 프로필 사진을 두는 디렉터리. 컨테이너 밖 볼륨이어야 재배포해도 사진이 남는다.
mirelab.profile-picture-dir=${MIRELAB_PROFILE_PICTURE_DIR:/var/mirelab/profile-pictures}
# 사진 한 장은 2MB 까지(MeController). 톰캣이 먼저 자르지 않게 여유를 조금 둔다.
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=4MB

# mirelab-realtime 릴레이가 /internal/** 을 부를 때 쓰는 공유 시크릿. 양쪽 값이 같아야 한다.
mirelab.internal-secret=${MIRELAB_INTERNAL_SECRET:}

# --- 구글 OAuth2 ---
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,email,profile
spring.security.oauth2.client.registration.google.redirect-uri=${mirelab.public-base-url}/api/login/oauth2/code/google
