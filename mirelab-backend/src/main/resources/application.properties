spring.application.name=mirelab-backend

# dev 프로필은 여기서 기본값으로 켜두지 않는다 — 운영 배포가 SPRING_PROFILES_ACTIVE 를
# 깜빡 안 정해도 DevDataSeeder(@Profile("dev"))가 조용히 돌아버리면 안 되기 때문이다.
# 로컬 실행은 build.gradle.kts 의 bootRun 태스크가 명시적으로 dev 를 켠다.

# --- Datasource (dev: H2 in-memory) ---
spring.datasource.url=jdbc:h2:mem:mirelab;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- H2 console: http://localhost:8080/h2-console ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JPA ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080
