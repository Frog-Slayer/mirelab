spring.application.name=mirelab-backend

# 운영 배포는 SPRING_PROFILES_ACTIVE 로 이 기본값을 덮어써서 DevDataSeeder(@Profile("dev"))가 안 뜨게 한다.
spring.profiles.default=dev

# --- Datasource (dev: H2 in-memory) ---
spring.datasource.url=jdbc:h2:mem:mirelab;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- H2 console: http://localhost:8080/h2-console ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JPA ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080
