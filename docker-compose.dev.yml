name: mirelab-dev

services:
  db:
    build:
      context: ./postgres
    environment:
      POSTGRES_DB: mirelab
      POSTGRES_USER: mirelab
      POSTGRES_PASSWORD: mirelab
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mirelab -d mirelab"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./mirelab-backend
      target: dev
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/mirelab
      SPRING_DATASOURCE_USERNAME: mirelab
      SPRING_DATASOURCE_PASSWORD: mirelab
      ALADIN_TTB_KEY: ${ALADIN_TTB_KEY:-}

      # 브라우저가 실제로 접근하는 주소. 구글에 등록한 리디렉션 URI 와 여기서 만들어지는
      # 값이 글자 그대로 같아야 한다 — tailscale 로 접속할 땐 .env 에서 그 주소로 바꾼다.
      # 프론트와 백엔드가 같은 origin 뒤에 있으므로(vite 프록시·nginx) 변수를 하나만 둔다 —
      # 둘로 나눠두면 .env 에서 한쪽만 바꿨을 때 로그인 후 엉뚱한 주소로 돌려보내진다.
      MIRELAB_FRONTEND_URL: ${MIRELAB_PUBLIC_BASE_URL:-http://localhost:5173}
      MIRELAB_PUBLIC_BASE_URL: ${MIRELAB_PUBLIC_BASE_URL:-http://localhost:5173}
      MIRELAB_COOKIE_SECURE: ${MIRELAB_COOKIE_SECURE:-false}
      MIRELAB_ADMIN_EMAIL: ${MIRELAB_ADMIN_EMAIL:-pj0642@gmail.com}

      # dev 는 값이 없어도 스택이 뜨는 게 우선이라 더미 기본값을 둔다(HS256 최소 32바이트).
      MIRELAB_JWT_SECRET: ${MIRELAB_JWT_SECRET:-dev-only-jwt-secret-at-least-32-bytes!!}
      # realtime 과 반드시 같은 값이어야 한다 — 같은 변수를 양쪽에 주는 이유가 이것이다.
      MIRELAB_INTERNAL_SECRET: ${MIRELAB_INTERNAL_SECRET:-dev-only-internal-secret}

      # 실제 구글 로그인을 해보려면 .env 에 진짜 값을 넣어야 한다. 빈 문자열이면
      # Spring 이 ClientRegistration 을 못 만들어 아예 부팅하지 않으므로 더미를 둔다.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-dev-google-client-id}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-dev-google-client-secret}
    volumes:
      - ./mirelab-backend:/app
      - backend_gradle_cache:/gradle-cache
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  realtime:
    build:
      context: ./mirelab-realtime
      target: dev
    environment:
      SPRING_BASE_URL: http://backend:8080
      PORT: "1234"
      # backend 의 MIRELAB_INTERNAL_SECRET 과 같은 값이어야 한다. 없으면 릴레이가 뜨지 않고,
      # 다르면 스냅샷 저장·접속 인가가 전부 403 이 되어 편집분이 조용히 유실된다.
      INTERNAL_SECRET: ${MIRELAB_INTERNAL_SECRET:-dev-only-internal-secret}
    volumes:
      - ./mirelab-realtime:/app
      - /app/node_modules
    ports:
      - "1234:1234"
    depends_on:
      - backend

  frontend:
    build:
      context: ./mirelab-frontend
      target: dev
    environment:
      BACKEND_PROXY_TARGET: http://backend:8080
      REALTIME_PROXY_TARGET: ws://realtime:1234
    volumes:
      - ./mirelab-frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend
      - realtime

volumes:
  pgdata:
  backend_gradle_cache:
